name: Verificar projeto
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          SITE_BASE: /TioPatinhas/
          SITE_URL: https://delta369369.github.io/TioPatinhas
      - run: pnpm exec tsx --test tests/output.test.tsx
        env:
          SITE_BASE: /TioPatinhas/
